# MySQL local para el backend. Lee las credenciales del archivo .env
# (el mismo que usa Spring Boot). Levantar con:  docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: aquasample-mysql
    environment:
      MYSQL_DATABASE: aquasample
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - aquasample-mysql-data:/var/lib/mysql

volumes:
  aquasample-mysql-data:

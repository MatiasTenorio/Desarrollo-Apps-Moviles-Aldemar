spring.application.name=aquasample-api
server.port=8080

# Las credenciales NO van en el repositorio: se leen del archivo .env
# (ignorado por git) o de variables de entorno. Ver README del backend.
spring.config.import=optional:file:.env[.properties]

# createDatabaseIfNotExist: crea la base "aquasample" si no existe (útil con Laragon).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:aquasample}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Flyway crea y versiona las tablas (db/migration); Hibernate no toca el esquema.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html

# Primer Administrador: se asegura al arrancar (correo en ADMIN_CORREO del .env).
aquasample.admin-inicial=${ADMIN_CORREO:}

# API de administración de Insforge (listar y dar de baja cuentas). La API key
# de administrador va SOLO en el .env del backend, nunca en la app.
insforge.url=${INSFORGE_URL:}
insforge.api-key=${INSFORGE_API_KEY:}

# Fotos de las muestras (PUT /api/muestras/{uuid}/foto). Por defecto Spring acepta solo 1 MB.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

spring.application.name=aquasample-api
server.port=8080

# Las credenciales NO van en el repositorio: se leen del archivo .env
# (ignorado por git) o de variables de entorno. Ver README del backend.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:aquasample}?serverTimezone=America/Santiago
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Flyway crea y versiona las tablas (db/migration); Hibernate no toca el esquema.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html
